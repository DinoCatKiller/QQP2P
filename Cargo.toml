[package]
name = "qqp2p"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
tokio-tungstenite = "0.21"
# Noise 协议（端到端加密，Curve25519 + ChaCha20-Poly1305 + BLAKE2s）
snow = "0.10"
rand = "0.8"

[dependencies.libp2p]
version = "0.56"
default-features = false
features = ["quic", "identify", "tokio", "request-response", "json", "macros"]