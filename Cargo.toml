[package]
name = "qqp2p"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
tokio-tungstenite = "0.21"

[dependencies.libp2p]
version = "0.56"
default-features = false
features = ["quic", "identify", "tokio", "request-response", "json", "macros"]

# QUIC 传输（绕开 libp2p 封装，直接管理 UDP socket + STUN + 打洞 + QUIC 握手）
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }