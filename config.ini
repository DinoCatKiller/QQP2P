# QQP2P 配置文件（预留：当前版本代码内硬编码默认值，尚未读取本文件）
# 手机端（Termux 编译）与电脑端默认一致，无需修改即可连接本机 NapCat。
#
# 手机端说明：
#   - 手机 NapCat 监听 127.0.0.1:3000(HTTP) / 3001(WS)，代码默认值即指向本机，无需改动
#   - 若要让手机端连电脑 NapCat（快速验证），需电脑 NapCat 监听 0.0.0.0 并同步改本文件/源码

[NapCat]
# HTTP API 地址
http_host = 127.0.0.1
http_port = 3000

# WebSocket 地址
ws_host = 127.0.0.1
ws_port = 3001

# Token (可选)
token =

[P2P]
# 默认TCP端口
default_port = 8080

# 默认用户ID
default_user_id = 12345

# 默认名称
default_name = P2PBot
